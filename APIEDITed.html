/* =========================================================
   GET UNICODE DIGIT VALUE
   ========================================================= */

function unicodeDigitValue(char){

    const cp=char.codePointAt(0);


    /* SPECIAL DIGITS */

    if(
        Object.prototype.hasOwnProperty.call(
            specialDigits,
            char
        )
    ){

        return specialDigits[char];

    }


    /* DECIMAL DIGIT BLOCKS */

    for(
        const zero of digitZeroBlocks
    ){

        if(
            cp>=zero &&
            cp<=zero+9
        ){

            return cp-zero;

        }

    }


    return null;

}



/* =========================================================
   NORMALIZE UNICODE NUMBERS
   ========================================================= */

function normalizeUnicodeNumbers(text){

    /*
       NFKC converts many compatibility characters
       into their normal equivalents.

       This helps with things like:

       ⁶ → 6
       ₆ → 6
       ⑥ → 6
       𝟔 → 6
       ６ → 6

       where supported by Unicode normalization.
    */

    let normalized=text.normalize("NFKC");


    let result="";


    /*
       Convert decimal digits from all supported
       scripts into ASCII digits.
    */

    for(
        const char of normalized
    ){

        const digit=
            unicodeDigitValue(char);


        if(
            digit!==null
        ){

            result+=digit.toString();

        }else{

            result+=char;

        }

    }


    /*
       KEYCAP EMOJIS.

       6️⃣ → 6
       7️⃣ → 7

       Also handle all digits.
    */

    result=result

        .replace(/0️⃣/gu,"0")
        .replace(/1️⃣/gu,"1")
        .replace(/2️⃣/gu,"2")
        .replace(/3️⃣/gu,"3")
        .replace(/4️⃣/gu,"4")
        .replace(/5️⃣/gu,"5")
        .replace(/6️⃣/gu,"6")
        .replace(/7️⃣/gu,"7")
        .replace(/8️⃣/gu,"8")
        .replace(/9️⃣/gu,"9");


    return result;

}



/* =========================================================
   ADVANCED 6 ↔ 7 DETECTOR
   =========================================================

   This detects:

   67
   6u7
   6abc7
   6🙂7
   6🔥😂💀7
   6 hello 7
   6---7

   AND:

   ⁶⁷
   ⁶hello⁷
   ⁶🙂⁷
   ₆hello₇
   ⑥abc⑦
   ❻🔥❼
   𝟔abc𝟕
   𝟞abc𝟟
   𝟨abc𝟩
   ６abc７
   ٦abc٧
   ۶abc۷
   ६abc७

   AND REVERSE:

   76
   7u6
   7🙂6
   ⁷hello⁶
   ₇🙂₆
   ⑦abc⑥

   IMPORTANT:

   The pattern only allows NON-DIGITS between them.

   Therefore:

   607       → ALLOWED
   687       → ALLOWED
   6007      → ALLOWED

   because another digit is between 6 and 7.

   ========================================================= */

function containsForbidden67Pattern(text){

    const converted=
        normalizeUnicodeNumbers(text);


    /*
       6 → anything except another digit → 7
    */

    const sixToSeven=
        /6[^\d]*7/u;


    /*
       7 → anything except another digit → 6
    */

    const sevenToSix=
        /7[^\d]*6/u;


    return(

        sixToSeven.test(
            converted
        )

        ||

        sevenToSix.test(
            converted
        )

    );

}



/* =========================================================
   NORMAL TEXT NORMALIZATION
   ========================================================= */

function normalizeText(text){

    /*
       First normalize Unicode compatibility characters.
    */

    let normalized=
        text.normalize("NFKC");


    let result="";


    /*
       Convert Unicode digits.
    */

    for(
        const char of normalized
    ){

        const digit=
            unicodeDigitValue(char);


        if(
            digit!==null
        ){

            result+=digit.toString();

        }else{

            result+=char.toLowerCase();

        }

    }


    return result

        /* Arabic normalization */

        .replace(
            /[أإآ]/g,
            "ا"
        )

        .replace(
            /ى/g,
            "ي"
        )

        .replace(
            /ة/g,
            "ه"
        )

        /* Arabic diacritics */

        .replace(
            /[\u064B-\u065F\u0670]/g,
            ""
        )

        /* Zero-width characters */

        .replace(
            /[\u200B-\u200D\uFEFF]/g,
            ""
        )

        /*
           Remove separators.
        */

        .replace(
            /[\s._\-|/\\*+~=!?@#$%^&()[\]{}<>:;"',،؛ـ]/g,
            ""
        );

}



/* =========================================================
   FINAL BAD WORD CHECK
   ========================================================= */

function containsBadWord(text){


    /*
       FIRST:

       Check the advanced 6/7 system.
    */

    if(
        containsForbidden67Pattern(text)
    ){

        return true;

    }


    /*
       THEN:

       Check normal prohibited words.
    */

    const normalizedText=
        normalizeText(text);


    for(
        const word of badWords
    ){

        const normalizedWord=
            normalizeText(word);


        if(

            normalizedWord.length>=3

            &&

            normalizedText.includes(
                normalizedWord
            )

        ){

            return true;

        }

    }


    return false;

}

/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(milliseconds){

    let totalSeconds=
        Math.ceil(
            milliseconds/1000
        );


    let minutes=
        Math.floor(
            totalSeconds/60
        );


    let seconds=
        totalSeconds%60;


    return(

        minutes+

        ":"+

        seconds
            .toString()
            .padStart(
                2,
                "0"
            )

    );

}



/* =========================================================
   START COOLDOWN
   ========================================================= */

function startCooldown(until){

    clearInterval(
        countdownInterval
    );


    cooldownBox.style.display=
        "block";


    submitBtn.disabled=true;


    function update(){

        const remaining=
            until-Date.now();


        if(
            remaining<=0
        ){

            clearInterval(
                countdownInterval
            );


            localStorage.removeItem(
                COOLDOWN_KEY
            );


            localStorage.removeItem(
                FIRST_MESSAGE_KEY
            );


            cooldownBox.style.display=
                "none";


            submitBtn.disabled=false;


            timer.innerText=
                "2:00";


            return;

        }


        timer.innerText=
            formatTime(
                remaining
            );

    }


    update();


    countdownInterval=
        setInterval(
            update,
            250
        );

}



/* =========================================================
   CHECK EXISTING COOLDOWN
   ========================================================= */

function checkCooldown(){

    const cooldownUntil=
        Number(
            localStorage.getItem(
                COOLDOWN_KEY
            )
        );


    if(

        cooldownUntil

        &&

        cooldownUntil>Date.now()

    ){

        startCooldown(
            cooldownUntil
        );


        return true;

    }


    if(
        cooldownUntil
    ){

        localStorage.removeItem(
            COOLDOWN_KEY
        );

    }


    return false;

}



/* =========================================================
   SEND FEEDBACK
   ========================================================= */

    /* =====================================================
       CHECK COOLDOWN
       ===================================================== */

    if(
        checkCooldown()
    ){

        return;

    }


    /* =====================================================
       GET MESSAGE
       ===================================================== */

        box.value.trim();


    /* =====================================================
       EMPTY MESSAGE
       ===================================================== */

    if(
        text===""
    ){

        alert(

        );


        return;

    }


    /* =====================================================
       BAD WORD / NUMBER CHECK
       ===================================================== */

    if(
        containsBadWord(
            text
        )
    ){

        alert(
            "🚫 Your message contains a prohibited word or number. Please remove it and try again 🚫."
        );


        return;

    }


    /* =====================================================
       PREVIOUS MESSAGE
       ===================================================== */

    const now=
        Date.now();


    const firstMessageTime=
        Number(
            localStorage.getItem(
                FIRST_MESSAGE_KEY
            )
        );


    let triggerCooldown=false;


    if(

        firstMessageTime

        &&

        now-firstMessageTime<=30000

    ){

        triggerCooldown=true;

    }


    /* =====================================================
       DISABLE BUTTON
       ===================================================== */

    submitBtn.disabled=true;


    try{


        /* =================================================
           SEND TO TELEGRAM
           ================================================= */

        const response=
            await fetch(

                `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        chat_id:
                            CHAT_ID,

                        text:
                            "📩 New Feedback\n\n"+
                            text

                    })

                }

            );


        const result=
            await response.json();


        /* =================================================
           TELEGRAM ERROR
           ================================================= */

        if(

            !response.ok

            ||

            !result.ok

        ){

            throw new Error(
                "Telegram request failed."
            );

        }


        /* =================================================
           SUCCESS
           ================================================= */

        alert(
            "Thank you for your feedback! ✅"
        );


        box.value="";


        count.innerText=
            "0";


        /* =================================================
           SECOND MESSAGE → 2 MINUTE COOLDOWN
           ================================================= */

        if(
            triggerCooldown
        ){

            const cooldownUntil=
                Date.now()+
                (2*60*1000);


            localStorage.setItem(

                COOLDOWN_KEY,

                cooldownUntil.toString()

            );


            localStorage.removeItem(
                FIRST_MESSAGE_KEY
            );


            startCooldown(
                cooldownUntil
            );


        }else{


            /* =============================================
               FIRST MESSAGE
               ============================================= */

            localStorage.setItem(

                FIRST_MESSAGE_KEY,

                Date.now().toString()

            );


            submitBtn.disabled=false;


            /*
               Remove first-message record
               after 30 seconds.
            */

            setTimeout(()=>{


                const savedTime=
                    Number(
                        localStorage.getItem(
                            FIRST_MESSAGE_KEY
                        )
                    );


                if(

                    savedTime

                    &&

                    Date.now()-savedTime>=30000

                ){

                    localStorage.removeItem(
                        FIRST_MESSAGE_KEY
                    );

                }


            },30000);

        }


    }catch(error){


        console.error(
            error
        );


        alert(
            "Could not send the feedback. Please try again ❌."
        );


        submitBtn.disabled=false;

    }

}
