<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع موقوف</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #080b10;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .icon {
            font-size: 90px;
            margin-bottom: 25px;
        }

        .message {
            font-size: 38px;
            font-weight: bold;
            line-height: 1.8;
            overflow-wrap: anywhere;
        }

        @media (max-width: 600px) {
            .message {
                font-size: 30px;
            }

            .icon {
                font-size: 75px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="icon">⛔</div>

        <div class="message">
            التحديث الجاي رح يبعتلي معلوماتكم مع الرسالة
        </div>

    </div>
</body>
</html>
