/* =========================================================
   NORMALIZE TEXT
   ========================================================= */

function normalizeText(text){

    return text
        .toLowerCase()

        /* Arabic letter normalization */
        .replace(/[أإآ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه")

        /* Arabic diacritics */
        .replace(/[\u064B-\u065F\u0670]/g,"")

        /* Zero-width characters */
        .replace(/[\u200B-\u200D\uFEFF]/g,"")

        /* Common separators / spaces */
        .replace(/[\s._\-|/\\*+~=!?@#$%^&()[\]{}<>:;"',،؛ـ]/g,"");
}


/* =========================================================
   CHECK BAD WORD
   ========================================================= */

function containsBadWord(text){

    const normalizedText=normalizeText(text);

    for(const word of badWords){

        const normalizedWord=normalizeText(word);

        if(
            normalizedWord.length >= 3 &&
            normalizedText.includes(normalizedWord)
        ){
            return true;
        }
    }

    return false;
}


/* =========================================================
   ELEMENTS
   ========================================================= */

const box=document.getElementById("feedback");
const submitBtn=document.getElementById("submitBtn");
const cooldownBox=document.getElementById("cooldown");
const timer=document.getElementById("timer");
const count=document.getElementById("count");


/* =========================================================
   STORAGE SETTINGS
   ========================================================= */

const FIRST_MESSAGE_KEY="ota_first_message_time";
const COOLDOWN_KEY="ota_cooldown_until";

let countdownInterval=null;


/* =========================================================
   CHARACTER COUNTER
   ========================================================= */

box.addEventListener("input",()=>{
    count.innerText=box.value.length;
});


/* =========================================================
   TIME FORMAT
   ========================================================= */

function formatTime(milliseconds){

    let totalSeconds=Math.ceil(milliseconds/1000);

    let minutes=Math.floor(totalSeconds/60);
    let seconds=totalSeconds%60;

    return (
        minutes +
        ":" +
        seconds.toString().padStart(2,"0")
    );
}


/* =========================================================
   START COOLDOWN DISPLAY
   ========================================================= */

function startCooldown(until){

    clearInterval(countdownInterval);

    cooldownBox.style.display="block";
    submitBtn.disabled=true;

    function update(){

        const remaining=until-Date.now();

        if(remaining<=0){

            clearInterval(countdownInterval);

            localStorage.removeItem(COOLDOWN_KEY);
            localStorage.removeItem(FIRST_MESSAGE_KEY);

            cooldownBox.style.display="none";
            submitBtn.disabled=false;
            timer.innerText="2:00";

            return;
        }

        timer.innerText=formatTime(remaining);
    }

    update();

    countdownInterval=setInterval(update,250);
}


/* =========================================================
   CHECK EXISTING COOLDOWN
   ========================================================= */

function checkCooldown(){

    const cooldownUntil=
        Number(localStorage.getItem(COOLDOWN_KEY));

    if(
        cooldownUntil &&
        cooldownUntil>Date.now()
    ){

        startCooldown(cooldownUntil);

        return true;
    }

    if(cooldownUntil){
        localStorage.removeItem(COOLDOWN_KEY);
    }

    return false;
}


/* =========================================================
   BAD WORD CHECK
   ========================================================= */

function containsBadWord(text){

    const lowerText=text.toLowerCase();

    for(const word of badWords){

        const cleanWord=word.trim().toLowerCase();

        if(cleanWord && lowerText.includes(cleanWord)){
            return true;
        }
    }

    return false;
}


/* =========================================================
   SEND FEEDBACK
   ========================================================= */

async function send(){

    /* Don't allow sending during cooldown */
    if(checkCooldown()){
        return;
    }


    let text=box.value.trim();


    /* Empty message */
    if(text==""){
        alert("Please enter feedback.");
        return;
    }


    /* Bad word check */
    if(containsBadWord(text)){

        alert(
            "🚫Your message contains a prohibited word. Please remove it and try again🚫."
        );

        return;
    }


    /*
       Check when the previous message was sent.
    */

    const now=Date.now();

    const firstMessageTime=
        Number(localStorage.getItem(FIRST_MESSAGE_KEY));


    /*
       If there was a previous message and
       it was sent within the last 30 seconds,
       activate the 2-minute cooldown.
    */

    let triggerCooldown=false;

    if(
        firstMessageTime &&
        now-firstMessageTime<=30000
    ){

        triggerCooldown=true;
    }


    /*
       Disable the button while sending
       so the user cannot double-click it.
    */

    submitBtn.disabled=true;


    try{

        const response=await fetch(
            `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    chat_id:CHAT_ID,
                    text:"📩 New Feedback\n\n"+text
                })
            }
        );


        const result=await response.json();


        /*
           If Telegram didn't accept the message,
           don't count it as a sent message.
        */

        if(!response.ok || !result.ok){

            throw new Error("Telegram request failed✖️.");
        }


        /*
           Message successfully sent.
        */

        alert("Thank you for your feedback!✅");

        box.value="";
        count.innerText="0";


        /*
           If this was the second message
           within 30 seconds:
           start 2-minute cooldown.
        */

        if(triggerCooldown){

            const cooldownUntil=
                Date.now()+(2*60*1000);

            localStorage.setItem(
                COOLDOWN_KEY,
                cooldownUntil.toString()
            );

            localStorage.removeItem(FIRST_MESSAGE_KEY);

            startCooldown(cooldownUntil);

        }else{

            /*
               This is the first message.
               Remember its time for 30 seconds.
            */

            localStorage.setItem(
                FIRST_MESSAGE_KEY,
                Date.now().toString()
            );

            submitBtn.disabled=false;


            /*
               Automatically remove the first-message
               record after 30 seconds if no second
               message was sent.
            */

            setTimeout(()=>{

                const savedTime=
                    Number(
                        localStorage.getItem(FIRST_MESSAGE_KEY)
                    );

                if(
                    savedTime &&
                    Date.now()-savedTime>=30000
                ){

                    localStorage.removeItem(
                        FIRST_MESSAGE_KEY
                    );
                }

            },30000);
        }

    }catch(error){

        console.error(error);

        alert(
            "Could not send the feedback. Please try again❌."
        );

        submitBtn.disabled=false;
    }
}
