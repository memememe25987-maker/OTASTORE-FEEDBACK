<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>    OTA STORE     Feedback</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#000;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    
    transform: scale(1.4);
    transform-origin: top center;
}

h1,h2{
    color:#00ccff;
    text-shadow:
        0 0 8px #00ccff,
        0 0 18px #00ccff,
        0 0 35px #00ccff;
}

textarea{
    width:100%;
    height:150px;
    background:#000;
    color:#fff;
    border:3px solid #00ccff;
    border-radius:12px;
    padding:12px;
    font-size:16px;
    resize:none;
    box-sizing:border-box;
    outline:none;
    box-shadow:0 0 18px #00ccff;
}

.counter{
    color:#00ccff;
}

button{
    width:100%;
    padding:14px;
    margin-top:20px;
    background:#00ccff;
    color:#000;
    border:none;
    border-radius:10px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 20px #00ccff;
    transition:.25s;
}

button:hover{
    box-shadow:0 0 35px #00ccff;
    transform:scale(1.03);
}
</style>
</head>

<body>

<div class="container">
<h1>OTA STORE</h1>

<h2>Feedback</h2>

<textarea id="feedback" maxlength="150"
placeholder="Type your feedback..."></textarea>

<div class="counter">
<span id="count">0</span>/150
</div>

<button onclick="send()">Submit</button>
</div>

<script>

const BOT_TOKEN="8534750967:AAGp-WLDaDTx3i5bRQ30uf8-9Atz9r1opOo";
const CHAT_ID="7965256318";

const box=document.getElementById("feedback");

box.addEventListener("input",()=>{
document.getElementById("count").innerText=box.value.length;
});

async function send(){

let text=box.value.trim();

if(text==""){
alert("Please enter feedback.");
return;
}

await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
chat_id:CHAT_ID,
text:"📩 New Feedback\n\n"+text
})
});

alert("Thank you for your feedback!");
box.value="";
document.getElementById("count").innerText="0";

}

</script>

</body>
</html>
