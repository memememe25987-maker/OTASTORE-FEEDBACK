/* =========================================================
   UNICODE DIGIT SYSTEM
   ========================================================= */

const unicodeZeroPoints = [

    0x0030, // Latin
    0x0660, // Arabic-Indic
    0x06F0, // Persian
    0x07C0, // NKo
    0x0966, // Devanagari
    0x09E6, // Bengali
    0x0A66, // Gurmukhi
    0x0AE6, // Gujarati
    0x0B66, // Oriya
    0x0BE6, // Tamil
    0x0C66, // Telugu
    0x0CE6, // Kannada
    0x0D66, // Malayalam
    0x0DE6, // Sinhala
    0x0E50, // Thai
    0x0ED0, // Lao
    0x0F20, // Tibetan
    0x1040, // Myanmar
    0x1090, // Myanmar Shan
    0x17E0, // Khmer
    0x1810, // Mongolian
    0x1946, // Limbu
    0x19D0, // New Tai Lue
    0x1A80, // Tai Tham Hora
    0x1A90, // Tai Tham Tham
    0x1B50, // Balinese
    0x1BB0, // Sundanese
    0x1C40, // Lepcha
    0x1C50, // Ol Chiki
    0xA620, // Vai
    0xA8D0, // Saurashtra
    0xA900, // Kayah Li
    0xA9D0, // Javanese
    0xA9F0, // Myanmar Tai Laing
    0xAA50, // Cham
    0xABF0, // Meetei Mayek
    0xFF10  // Fullwidth

];



/* =========================================================
   GET UNICODE DIGIT VALUE
   ========================================================= */

function getUnicodeDigitValue(char){

    if(!char){
        return null;
    }

    const code=char.codePointAt(0);

    for(const zero of unicodeZeroPoints){

        if(
            code>=zero &&
            code<=zero+9
        ){

            return code-zero;

        }

    }

    return null;

}



/* =========================================================
   NORMALIZE TEXT
   ========================================================= */

function normalizeText(text){

    let result=text;


    /*
       Unicode normalization
    */

    try{

        result=result.normalize("NFKC");

    }catch(e){}


    /*
       Lowercase
    */

    result=result.toLowerCase();


    /* =====================================================
       NUMBER WORDS
       =====================================================

       Arabic:

       ست
       ستة
       سبع
       سبعة

       English:

       six
       seven
       ===================================================== */


    result=result

        .replace(/ستة/g,"6")
        .replace(/ست/g,"6")

        .replace(/سبعة/g,"7")
        .replace(/سبع/g,"7")

        .replace(/six/g,"6")
        .replace(/seven/g,"7");


    /*
       Arabic letters
    */

    result=result

        .replace(/[أإآٱ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه");


    /*
       Arabic / Persian digits
    */

    result=result

        .replace(/٠/g,"0")
        .replace(/١/g,"1")
        .replace(/٢/g,"2")
        .replace(/٣/g,"3")
        .replace(/٤/g,"4")
        .replace(/٥/g,"5")
        .replace(/٦/g,"6")
        .replace(/٧/g,"7")
        .replace(/٨/g,"8")
        .replace(/٩/g,"9")

        .replace(/۰/g,"0")
        .replace(/۱/g,"1")
        .replace(/۲/g,"2")
        .replace(/۳/g,"3")
        .replace(/۴/g,"4")
        .replace(/۵/g,"5")
        .replace(/۶/g,"6")
        .replace(/۷/g,"7")
        .replace(/۸/g,"8")
        .replace(/۹/g,"9");


    /*
       Arabic diacritics
    */

    result=result.replace(
        /[\u064B-\u065F\u0670]/g,
        ""
    );


    /*
       Zero-width / invisible characters
    */

    result=result.replace(
        /[\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g,
        ""
    );


    /*
       Tatweel
    */

    result=result.replace(
        /ـ/g,
        ""
    );


    /*
       Remove common separators
    */

    result=result.replace(
        /[\s._\-|/\\*+~=!?@#$%^&()[\]{}<>:;"',،؛]/g,
        ""
    );


    /*
       Convert decimal digits from other
       Unicode writing systems.
    */

    let output="";


    for(const char of result){

        const value=getUnicodeDigitValue(char);


        if(value!==null){

            output+=String(value);

        }else{

            output+=char;

        }

    }


    return output;

}



/* =========================================================
   BAD WORD CHECK
   ========================================================= */

function containsBadWord(text){

    const normalizedText=
        normalizeText(text);


    for(const word of badWords){

        const normalizedWord=
            normalizeText(word);


        if(
            normalizedWord.length>=3 &&
            normalizedText.includes(normalizedWord)
        ){

            return true;

        }

    }


    return false;

}



/* =========================================================
   6 / 7 SECURITY FILTER
   =========================================================

   Detects:

   6 + 7
   ست + سبع
   ستة + سبعة
   six + seven
   ٦ + ٧
   ６ + ７

   Also detects them when characters are
   between the numbers.

   Example:

   6abc7
   ستة hello سبعة
   six 🔥 seven

   ========================================================= */

function containsSixSevenCombination(text){

    const normalized=
        normalizeText(text);


    const has6=
        normalized.includes("6");


    const has7=
        normalized.includes("7");


    /*
       If both exist anywhere in the same
       message, block it.
    */

    if(has6 && has7){

        return true;

    }


    return false;

}



/* =========================================================
   PREVIOUS MESSAGE 6 / 7 CHECK
   ========================================================= */

const LAST_DIGIT_KEY=
    "ota_last_6_7_digit";



function getSixSevenState(text){

    const normalized=
        normalizeText(text);


    const has6=
        normalized.includes("6");


    const has7=
        normalized.includes("7");


    if(
        has6 &&
        !has7
    ){

        return "6";

    }


    if(
        has7 &&
        !has6
    ){

        return "7";

    }


    return null;

}

const FIRST_MESSAGE_KEY=
    "ota_first_message_time";


const COOLDOWN_KEY=
    "ota_cooldown_until";


let countdownInterval=null;



/* =========================================================

   ========================================================= */

    "input",
    ()=>{

        count.innerText=

/* =========================================================
   TIME FORMAT
   ========================================================= */

function formatTime(milliseconds){

    let totalSeconds=
        Math.ceil(
            milliseconds/1000
        );


    let minutes=
        Math.floor(
            totalSeconds/60
        );


    let seconds=
        totalSeconds%60;


    return (

        minutes+
        ":"+
        seconds
            .toString()
            .padStart(2,"0")

    );

}



/* =========================================================
   START COOLDOWN DISPLAY
   ========================================================= */

function startCooldown(until){

    clearInterval(
        countdownInterval
    );


    cooldownBox.style.display=
        "block";


    submitBtn.disabled=
        true;


    function update(){

        const remaining=
            until-Date.now();


        if(remaining<=0){

            clearInterval(
                countdownInterval
            );


            localStorage.removeItem(
                COOLDOWN_KEY
            );


            localStorage.removeItem(
                FIRST_MESSAGE_KEY
            );


            cooldownBox.style.display=
                "none";


            submitBtn.disabled=
                false;


            timer.innerText=
                "2:00";


            return;

        }


        timer.innerText=
            formatTime(remaining);

    }


    update();


    countdownInterval=
        setInterval(
            update,
            250
        );

}



/* =========================================================
   CHECK EXISTING COOLDOWN
   ========================================================= */

function checkCooldown(){

    const cooldownUntil=
        Number(
            localStorage.getItem(
                COOLDOWN_KEY
            )
        );


    if(
        cooldownUntil &&
        cooldownUntil>Date.now()
    ){

        startCooldown(
            cooldownUntil
        );


        return true;

    }


    if(cooldownUntil){

        localStorage.removeItem(
            COOLDOWN_KEY
        );

    }


    return false;

}



/* =========================================================
   SEND FEEDBACK
   ========================================================= */

async function send(){


    /*
       Don't allow sending during cooldown.
    */

    if(checkCooldown()){

        return;

    }


    let text=
        box.value.trim();


    /*
       Empty message.
    */

    if(text===""){

        alert(
            "Please enter feedback."
        );

        return;

    }


    /* =====================================================
       6 / 7 SAME MESSAGE PROTECTION
       ===================================================== */

    if(
        containsSixSevenCombination(text)
    ){

        alert(
            "🚫 This message cannot be sent."
        );

        return;

    }


    /* =====================================================
       BAD WORD PROTECTION
       ===================================================== */

    if(
        containsBadWord(text)
    ){

        alert(
            "🚫Your message contains a prohibited word. Please remove it and try again🚫."
        );

        return;

    }


    /* =====================================================
       6 / 7 PREVIOUS MESSAGE PROTECTION
       ===================================================== */

    const currentState=
        getSixSevenState(text);


    const previousState=
        localStorage.getItem(
            LAST_DIGIT_KEY
        );


    /*
       Previous = 6
       Current  = 7

       OR

       Previous = 7
       Current  = 6

       => BLOCK
    */

    if(

        previousState &&
        currentState &&
        previousState!==currentState

    ){

        alert(
            "🚫 This message cannot be sent."
        );


        /*
           IMPORTANT:

           Do NOT change LAST_DIGIT_KEY.

           This prevents bypassing the filter
           by repeatedly trying the opposite number.
        */

        return;

    }


    /*
       Disable button while sending.
    */

    submitBtn.disabled=
        true;


    try{


        const response=
            await fetch(

                `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        chat_id:
                            CHAT_ID,

                        text:
                            "📩 New Feedback\n\n"+
                            text

                    })

                }

            );


        const result=
            await response.json();


        /*
           Telegram failed.
        */

        if(

            !response.ok ||
            !result.ok

        ){

            throw new Error(
                "Telegram request failed."
            );

        }


        /* =================================================
           SUCCESS
           ================================================= */

        alert(
            "Thank you for your feedback!✅"
        );


        box.value="";


        count.innerText=
            "0";


        /*
           SAVE 6 / 7 STATE ONLY AFTER
           SUCCESSFUL TELEGRAM SEND.
        */

        if(currentState){

            localStorage.setItem(

                LAST_DIGIT_KEY,

                currentState

            );

        }


        /* =================================================
           NORMAL COOLDOWN SYSTEM
           ================================================= */

        const now=
            Date.now();


        const firstMessageTime=
            Number(

                localStorage.getItem(
                    FIRST_MESSAGE_KEY
                )

            );


        let triggerCooldown=
            false;


        if(

            firstMessageTime &&
            now-firstMessageTime<=30000

        ){

            triggerCooldown=
                true;

        }


        if(triggerCooldown){


            const cooldownUntil=
                Date.now()+
                (2*60*1000);


            localStorage.setItem(

                COOLDOWN_KEY,

                cooldownUntil.toString()

            );


            localStorage.removeItem(
                FIRST_MESSAGE_KEY
            );


            startCooldown(
                cooldownUntil
            );


        }else{


            localStorage.setItem(

                FIRST_MESSAGE_KEY,

                Date.now().toString()

            );


            submitBtn.disabled=
                false;


            setTimeout(()=>{


                const savedTime=
                    Number(

                        localStorage.getItem(
                            FIRST_MESSAGE_KEY
                        )

                    );


                if(

                    savedTime &&
                    Date.now()-savedTime>=30000

                ){

                    localStorage.removeItem(
                        FIRST_MESSAGE_KEY
                    );

                }


            },30000);

        }


    }catch(error){


        console.error(error);


        alert(
            "Could not send the feedback. Please try again❌."
        );


        submitBtn.disabled=
            false;

    }

}
