
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTA STORE | Maintenance</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #02060d;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
}

.background {
    position: absolute;
    inset: -50%;
    background:
        radial-gradient(circle at 50% 50%, #063d69 0%, transparent 30%),
        radial-gradient(circle at 20% 70%, #001b36 0%, transparent 35%),
        radial-gradient(circle at 80% 20%, #002b4b 0%, transparent 35%);
    animation: backgroundMove 12s ease-in-out infinite alternate;
}

@keyframes backgroundMove {
    from { transform: translate(-3%, -2%) scale(1); }
    to { transform: translate(3%, 2%) scale(1.2); }
}

.grid {
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(rgba(0,170,255,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,170,255,.045) 1px, transparent 1px);
    background-size: 45px 45px;
    mask-image: linear-gradient(transparent, black, transparent);
}

.glow {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: #008cff;
    filter: blur(130px);
    opacity: .18;
    animation: pulse 4s infinite alternate;
}

@keyframes pulse {
    to { opacity: .4; transform: scale(1.5); }
}

.container {
    position: relative;
    z-index: 2;
    width: 100%;
    text-align: center;
    padding: 25px;
    animation: entrance 1.5s ease forwards;
}

@keyframes entrance {
    from { opacity: 0; transform: translateY(35px); }
    to { opacity: 1; transform: translateY(0); }
}

.icon {
    width: 95px;
    height: 95px;
    border: 2px solid rgba(0,174,255,.5);
    border-radius: 50%;
    margin: 0 auto 35px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 30px rgba(0,145,255,.2),
                inset 0 0 25px rgba(0,145,255,.12);
    animation: rotate 12s linear infinite, iconGlow 3s infinite alternate;
}

.icon svg {
    width: 43px;
    height: 43px;
    stroke: #20baff;
    stroke-width: 1.7;
    fill: none;
}

@keyframes rotate {
    to { transform: rotate(360deg); }
}

@keyframes iconGlow {
    to { box-shadow: 0 0 55px rgba(0,145,255,.5); }
}

h1 {
    font-size: clamp(27px, 7vw, 43px);
    font-weight: 800;
    margin-bottom: 18px;
    background: linear-gradient(90deg, #fff, #29bdff, #fff);
    background-size: 200%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 4s linear infinite;
}

@keyframes shine {
    to { background-position: 200%; }
}

.line {
    width: 90px;
    height: 3px;
    background: #00aaff;
    margin: 0 auto 40px;
    border-radius: 5px;
    box-shadow: 0 0 15px #00aaff;
    animation: line 2s infinite alternate;
}

@keyframes line {
    to { width: 145px; opacity: .5; }
}

.brand {
    position: relative;
    display: inline-block;
    font-size: clamp(36px, 10vw, 55px);
    font-weight: 1000;
    letter-spacing: 5px;
    color: #20baff;
    text-shadow: 0 0 10px #008cff,
                 0 0 30px rgba(0,145,255,.7);
    animation: brandGlow 3s infinite alternate;
}

@keyframes brandGlow {
    to { text-shadow: 0 0 20px #00aaff, 0 0 55px #0077ff; }
}

.brand::after {
    content: "";
    position: absolute;
    bottom: -12px;
    left: 10%;
    width: 80%;
    height: 2px;
    background: linear-gradient(90deg, transparent, #00aaff, transparent);
}

@media(max-height: 550px) {
    .icon { width: 65px; height: 65px; margin-bottom: 15px; }
    .icon svg { width: 30px; }
    .line { margin-bottom: 20px; }
}
</style>
</head>

<body>

<div class="background"></div>
<div class="grid"></div>
<div class="glow"></div>

<div class="container">

    <div class="icon">
        <svg viewBox="0 0 24 24">
            <path d="M14.7 6.3a5 5 0 0 0-6.6 6.6L3 18l3 3 5.1-5.1a5 5 0 0 0 6.6-6.6L14 13l-3-3z"/>
        </svg>
    </div>

    <h1>الموقع قيد الصيانة</h1>

    <div class="line"></div>

    <div class="brand">OTA STORE</div>

</div>

</body>
</html>
