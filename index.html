/* =========================================================
   NORMALIZE TEXT
   ========================================================= */

function normalizeText(text){

    let result=text;


    /*
       Unicode normalization
    */

    try{

        result=result.normalize("NFKC");

    }catch(e){}


    /*
       Lowercase
    */

    result=result.toLowerCase();


    /*
       Arabic letters
    */

    result=result

        .replace(/[أإآٱ]/g,"ا")
        .replace(/ى/g,"ي")
        .replace(/ة/g,"ه");


    /*
       Arabic / Persian digits
    */

    result=result

        .replace(/٠/g,"0")
        .replace(/١/g,"1")
        .replace(/٢/g,"2")
        .replace(/٣/g,"3")
        .replace(/٤/g,"4")
        .replace(/٥/g,"5")
        .replace(/٦/g,"6")
        .replace(/٧/g,"7")
        .replace(/٨/g,"8")
        .replace(/٩/g,"9")

        .replace(/۰/g,"0")
        .replace(/۱/g,"1")
        .replace(/۲/g,"2")
        .replace(/۳/g,"3")
        .replace(/۴/g,"4")
        .replace(/۵/g,"5")
        .replace(/۶/g,"6")
        .replace(/۷/g,"7")
        .replace(/۸/g,"8")
        .replace(/۹/g,"9");


    /*
       Arabic diacritics
    */

    result=result.replace(
        /[\u064B-\u065F\u0670]/g,
        ""
    );


    /*
       Zero-width / invisible characters
    */

    result=result.replace(
        /[\u200B-\u200F\u202A-\u202E\u2060-\u206F\uFEFF]/g,
        ""
    );


    /*
       Tatweel
    */

    result=result.replace(
        /ـ/g,
        ""
    );


    /*
       Remove common separators
    */

    result=result.replace(
        /[\s._\-|/\\*+~=!?@#$%^&()[\]{}<>:;"',،؛]/g,
        ""
    );


    return result;

}



/* =========================================================
   BAD WORD CHECK
   ========================================================= */

function containsBadWord(text){

    const normalizedText=
        normalizeText(text);


    for(const word of badWords){

        const normalizedWord=
            normalizeText(word);


        if(
            normalizedWord.length>=3 &&
            normalizedText.includes(normalizedWord)
        ){

            return true;

        }

    }


    return false;

}



/* =========================================================

const cooldownBox=
    document.getElementById("cooldown");


const timer=
    document.getElementById("timer");


const count=
    document.getElementById("count");



/* =========================================================
   STORAGE SETTINGS
   ========================================================= */

const FIRST_MESSAGE_KEY=
    "ota_first_message_time";


const COOLDOWN_KEY=
    "ota_cooldown_until";


let countdownInterval=null;



/* =========================================================
   CHARACTER COUNTER
   ========================================================= */

box.addEventListener(
    "input",
    ()=>{

        count.innerText=
            box.value.length;

    }
);



/* =========================================================
   TIME FORMAT
   ========================================================= */

function formatTime(milliseconds){

    let totalSeconds=
        Math.ceil(
            milliseconds/1000
        );


    let minutes=
        Math.floor(
            totalSeconds/60
        );


    let seconds=
        totalSeconds%60;


    return (

        minutes+
        ":"+
        seconds
            .toString()
            .padStart(2,"0")

    );

}



/* =========================================================
   START COOLDOWN DISPLAY
   ========================================================= */

function startCooldown(until){

    clearInterval(
        countdownInterval
    );


    cooldownBox.style.display=
        "block";


    submitBtn.disabled=
        true;


    function update(){

        const remaining=
            until-Date.now();


        if(remaining<=0){

            clearInterval(
                countdownInterval
            );


            localStorage.removeItem(
                COOLDOWN_KEY
            );


            localStorage.removeItem(
                FIRST_MESSAGE_KEY
            );


            cooldownBox.style.display=
                "none";


            submitBtn.disabled=
                false;


            timer.innerText=
                "2:00";


            return;

        }


        timer.innerText=
            formatTime(remaining);

    }


    update();


    countdownInterval=
        setInterval(
            update,
            250
        );

}



/* =========================================================
   CHECK EXISTING COOLDOWN
   ========================================================= */

function checkCooldown(){

    const cooldownUntil=
        Number(
            localStorage.getItem(
                COOLDOWN_KEY
            )
        );


    if(
        cooldownUntil &&
        cooldownUntil>Date.now()
    ){

        startCooldown(
            cooldownUntil
        );


        return true;

    }


    if(cooldownUntil){

        localStorage.removeItem(
            COOLDOWN_KEY
        );

    }


    return false;

}



/* =========================================================
   SEND FEEDBACK
   ========================================================= */

async function send(){


    /*
       Don't allow sending during cooldown.
    */

    if(checkCooldown()){

        return;

    }


    let text=
        box.value.trim();


    /*
       Empty message.
    */

    if(text===""){

        alert(
            "Please enter feedback."
        );

        return;

    }


    /* =====================================================
       BAD WORD PROTECTION
       ===================================================== */

    if(
        containsBadWord(text)
    ){

        alert(
            "🚫Your message contains a prohibited word. Please remove it and try again🚫."
        );

        return;

    }


    /*
       Disable button while sending.
    */

    submitBtn.disabled=
        true;


    try{


        const response=
            await fetch(

                `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,

                {

                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:JSON.stringify({

                        chat_id:
                            CHAT_ID,

                        text:
                            "📩 New Feedback\n\n"+
                            text

                    })

                }

            );


        const result=
            await response.json();


        /*
           Telegram failed.
        */

        if(

            !response.ok ||
            !result.ok

        ){

            throw new Error(
                "Telegram request failed."
            );

        }


        /* =================================================
           SUCCESS
           ================================================= */

        alert(
            "Thank you for your feedback!✅"
        );


        box.value="";


        count.innerText=
            "0";


        /* =================================================
           NORMAL COOLDOWN SYSTEM
           ================================================= */

        const now=
            Date.now();


        const firstMessageTime=
            Number(

                localStorage.getItem(
                    FIRST_MESSAGE_KEY
                )

            );


        let triggerCooldown=
            false;


        if(

            firstMessageTime &&
            now-firstMessageTime<=30000

        ){

            triggerCooldown=
                true;

        }


        if(triggerCooldown){


            const cooldownUntil=
                Date.now()+
                (2*60*1000);


            localStorage.setItem(

                COOLDOWN_KEY,

                cooldownUntil.toString()

            );


            localStorage.removeItem(
                FIRST_MESSAGE_KEY
            );


            startCooldown(
                cooldownUntil
            );


        }else{


            localStorage.setItem(

                FIRST_MESSAGE_KEY,

                Date.now().toString()

            );


            submitBtn.disabled=
                false;


            setTimeout(()=>{


                const savedTime=
                    Number(

                        localStorage.getItem(
                            FIRST_MESSAGE_KEY
                        )

                    );


                if(

                    savedTime &&
                    Date.now()-savedTime>=30000

                ){

                    localStorage.removeItem(
                        FIRST_MESSAGE_KEY
                    );

                }


            },30000);

        }


    }catch(error){


        console.error(error);


        alert(
            "Could not send the feedback. Please try again❌."
        );


        submitBtn.disabled=
            false;

    }

}
