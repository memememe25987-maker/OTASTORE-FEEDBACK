<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OTA STORE Feedback</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    background: #000;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: Arial, sans-serif;

    color: white;
}

.container {
    width: min(90%, 500px);
    text-align: center;
}

h1 {
    margin: 0 0 10px;

    color: #00ccff;

    text-shadow:
        0 0 8px #00ccff,
        0 0 18px #00ccff,
        0 0 35px #00ccff;
}

h2 {
    margin: 0 0 25px;

    color: #00ccff;

    text-shadow:
        0 0 8px #00ccff,
        0 0 18px #00ccff;
}

textarea {
    width: 100%;
    height: 150px;

    padding: 15px;

    background: #000;

    color: white;

    border: 2px solid #00ccff;
    border-radius: 12px;

    outline: none;

    resize: none;

    font-size: 16px;

    box-shadow:
        0 0 10px #00ccff,
        inset 0 0 10px rgba(0, 204, 255, 0.15);
}

textarea:focus {
    box-shadow:
        0 0 15px #00ccff,
        0 0 30px rgba(0, 204, 255, 0.35),
        inset 0 0 15px rgba(0, 204, 255, 0.15);
}

textarea::placeholder {
    color: #777;
}

.counter {
    margin-top: 8px;

    color: #00ccff;

    font-size: 14px;
}

button {
    width: 100%;

    margin-top: 20px;

    padding: 14px;

    border: none;
    border-radius: 10px;

    background: #00ccff;

    color: #000;

    font-size: 18px;
    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 0 10px #00ccff,
        0 0 25px rgba(0, 204, 255, 0.5);

    transition: 0.2s;
}

button:hover {
    transform: scale(1.02);

    box-shadow:
        0 0 15px #00ccff,
        0 0 35px rgba(0, 204, 255, 0.7);
}

button:disabled {
    background: #333;

    color: #777;

    cursor: not-allowed;

    box-shadow: none;

    transform: none;
}

#cooldown {
    display: none;

    margin-top: 15px;

    color: #ff3333;

    font-weight: bold;

    text-shadow:
        0 0 8px #ff3333,
        0 0 18px #ff3333;
}

</style>

</head>

<body>

<div class="container">

    <h1>OTA STORE</h1>

    <h2>Feedback</h2>

    <textarea
        id="feedback"
        maxlength="150"
        placeholder="Type your feedback..."
    ></textarea>

    <div class="counter">
        <span id="count">0</span>/150
    </div>

    <button
        id="submitBtn"
        onclick="send()"
    >
        SUBMIT
    </button>

    <div id="cooldown">
        Cooldown:
        <span id="timer">2:00</span>
    </div>

</div>


<script>

/* =====================================================
   CLOUDFLARE WORKER URL
   ===================================================== */

const WORKER_URL =
    "https://cold-glade-bb87.ota471taki0000-c52.workers.dev";


/* =====================================================
   ELEMENTS
   ===================================================== */

const box =
    document.getElementById("feedback");

const count =
    document.getElementById("count");

const submitBtn =
    document.getElementById("submitBtn");

const cooldownBox =
    document.getElementById("cooldown");

const timer =
    document.getElementById("timer");


/* =====================================================
   CHARACTER COUNTER
   ===================================================== */

box.addEventListener("input", () => {

    count.textContent =
        box.value.length;

});


/* =====================================================
   COOLDOWN STORAGE
   ===================================================== */

const FIRST_MESSAGE_KEY =
    "ota_first_message_time";

const COOLDOWN_KEY =
    "ota_cooldown_until";

let countdownInterval = null;


/* =====================================================
   FORMAT TIME
   ===================================================== */

function formatTime(ms) {

    const seconds =
        Math.ceil(ms / 1000);

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        seconds % 60;

    return (
        minutes +
        ":" +
        remainingSeconds
            .toString()
            .padStart(2, "0")
    );
}


/* =====================================================
   START COOLDOWN
   ===================================================== */

function startCooldown(until) {

    clearInterval(countdownInterval);

    cooldownBox.style.display =
        "block";

    submitBtn.disabled =
        true;

    function update() {

        const remaining =
            until - Date.now();

        if (remaining <= 0) {

            clearInterval(
                countdownInterval
            );

            localStorage.removeItem(
                COOLDOWN_KEY
            );

            localStorage.removeItem(
                FIRST_MESSAGE_KEY
            );

            cooldownBox.style.display =
                "none";

            submitBtn.disabled =
                false;

            timer.textContent =
                "2:00";

            return;
        }

        timer.textContent =
            formatTime(remaining);
    }

    update();

    countdownInterval =
        setInterval(update, 250);
}


/* =====================================================
   CHECK COOLDOWN
   ===================================================== */

function checkCooldown() {

    const until =
        Number(
            localStorage.getItem(
                COOLDOWN_KEY
            )
        );

    if (
        until &&
        until > Date.now()
    ) {

        startCooldown(until);

        return true;
    }

    if (until) {

        localStorage.removeItem(
            COOLDOWN_KEY
        );
    }

    return false;
}


/* =====================================================
   SEND
   ===================================================== */

async function send() {

    if (checkCooldown()) {
        return;
    }

    const text =
        box.value.trim();

    if (!text) {

        alert(
            "Please enter your feedback."
        );

        return;
    }

    submitBtn.disabled =
        true;

    try {

        /*
         * ONLY the feedback text
         * goes to Cloudflare.
         *
         * BOT_TOKEN and CHAT_ID
         * are NOT here.
         */

        const response =
            await fetch(
                WORKER_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        text: text
                    })
                }
            );

        const result =
            await response.json();

        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Worker failed"
            );
        }


        /* ==============================
           SUCCESS
           ============================== */

        alert(
            "Thank you for your feedback! ✅"
        );

        box.value = "";

        count.textContent =
            "0";


        /* ==============================
           EXISTING 30 SECOND LOGIC
           ============================== */

        const now =
            Date.now();

        const firstMessage =
            Number(
                localStorage.getItem(
                    FIRST_MESSAGE_KEY
                )
            );

        if (
            firstMessage &&
            now - firstMessage <= 30000
        ) {

            const cooldownUntil =
                now + 120000;

            localStorage.setItem(
                COOLDOWN_KEY,
                cooldownUntil
            );

            localStorage.removeItem(
                FIRST_MESSAGE_KEY
            );

            startCooldown(
                cooldownUntil
            );

        } else {

            localStorage.setItem(
                FIRST_MESSAGE_KEY,
                now
            );

            submitBtn.disabled =
                false;

        }

    } catch (error) {

        console.error(error);

        alert(
            "Could not send the feedback. Please try again ❌."
        );

        submitBtn.disabled =
            false;
    }
}


/* =====================================================
   CHECK WHEN PAGE OPENS
   ===================================================== */

checkCooldown();

</script>

</body>

</html>
